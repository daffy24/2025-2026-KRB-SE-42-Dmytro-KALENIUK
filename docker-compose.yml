services:
  postgres:
    image: postgres:16-alpine
    container_name: education-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - education-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: education-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  education-api:
    build:
      context: .
      dockerfile: docker/education-api/Dockerfile
    container_name: education-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=education;Username=postgres;Password=postgres
      Authentication__Authority: http://localhost:8080/realms/education-platform
      Authentication__MetadataAddress: http://keycloak:8080/realms/education-platform/.well-known/openid-configuration
      Authentication__Issuer: http://localhost:8080/realms/education-platform
      Authentication__Audience: education-api
      Authentication__RequireHttpsMetadata: "false"
      Authentication__UseDevelopmentAuth: "false"
    ports:
      - "5045:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  education-postgres-data:
